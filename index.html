<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Implay Central</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Implay">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Implay Central · tema Noite (principal) e Dia. Tokens do design system Implay. */
:root{
  --bg:#0B0B0C; --raised:#17171A; --raised2:#1F1F23; --text:#F7F7F2; --muted:#A3A3AB; --line:#2A2A30;
  --volt:#D4FF2F; --flash:#FF3FA4; --cobalt:#2B3BFF; --on-brand:#0B0B0C;
  --accent-text:#D4FF2F; --step:#D4FF2F; --bar:#D4FF2F;
  --ok:#3DDC97; --warn:#FFB23F; --bad:#FF6B6F; --info:#8C97FF;
  --ok-bg:rgba(61,220,151,.12); --warn-bg:rgba(255,178,63,.12); --bad-bg:rgba(255,107,111,.12); --info-bg:rgba(140,151,255,.14); --flash-bg:rgba(255,63,164,.14);
  --shade:rgba(0,0,0,.6); --glass:rgba(11,11,12,.86);
  --f-display:"Unbounded","Noto Sans KR",system-ui,sans-serif;
  --f-text:"Inter","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --r-sm:10px; --r-lg:20px; --r-pill:999px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F7F2; --raised:#FFFFFF; --raised2:#F0F0E9; --text:#0B0B0C; --muted:#55555C; --line:#E2E2DA;
  --accent-text:#2B3BFF; --step:#0B0B0C; --bar:#2B3BFF;
  --ok:#13804F; --warn:#9A5B00; --bad:#C62828; --info:#2B3BFF;
  --ok-bg:rgba(19,128,79,.1); --warn-bg:rgba(154,91,0,.1); --bad-bg:rgba(198,40,40,.08); --info-bg:rgba(43,59,255,.08); --flash-bg:rgba(255,63,164,.12);
  --shade:rgba(11,11,12,.4); --glass:rgba(247,247,242,.9); color-scheme:light }

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.1}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px;background:none;border:0;text-align:left}
.brand svg{width:132px;height:auto;display:block}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{white-space:nowrap;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px;color:var(--muted);font-weight:600}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--raised);color:var(--text)}
.nav button[aria-current="page"]{background:var(--volt);color:var(--on-brand)}
.nav .cnt{font-size:11px;font-weight:800;background:var(--flash);color:var(--on-brand);border-radius:var(--r-pill);padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.side .foot button{background:none;border:0;padding:0;color:var(--muted);text-align:left;font-size:12px;text-decoration:underline}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 14px;color:var(--muted)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;font-size:16px}
@media (min-width:900px){.search svg{width:16px;height:16px;flex:none}
.search input{font-size:14px}}
.top .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;flex:none;color:var(--text)}
.ibtn svg{width:18px;height:18px}
.me{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--on-brand);flex:none}
.av.sm{width:22px;height:22px;font-size:9px}
.me b{display:block;font-size:13px}.me small{font-size:11px;color:var(--muted)}

.page{padding:24px 28px 80px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.full{grid-column:1/-1}

.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-weight:700;font-size:12px;text-decoration:none}
.empty{color:var(--muted);font-size:13px;margin:0;padding:6px 0}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:9px 16px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--raised);white-space:nowrap;min-height:40px;color:var(--text);text-decoration:none}
.btn.sticker{background:var(--volt);color:var(--on-brand);border:2px solid var(--on-brand);box-shadow:4px 4px 0 var(--flash);transition:transform .12s, box-shadow .12s}
.btn.sticker:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--flash)}
.btn.sticker:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--flash)}
.btn.ghost{background:none}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 12px;font-size:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--raised);border-radius:var(--r-pill);padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);min-height:34px}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips.big button{min-height:40px;font-size:13px}

/* ---------- pílulas ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--raised2);color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--flash);color:var(--on-brand);border-radius:var(--r-pill);padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--on-brand);animation:pulse 1.4s infinite;display:inline-block}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden;padding:0}
.hero .l{padding:26px 28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero .l p{margin:0;color:var(--muted);max-width:42ch}
.hero .r{background:var(--cobalt);color:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero .r .label{color:rgba(255,255,255,.78)}
.onair{display:flex;flex-direction:column;gap:10px}
.onair .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;border:0;color:#fff;text-align:left;width:100%}
.onair .it b{font-family:var(--f-display);font-size:13px;display:block}
.onair .it small{color:rgba(255,255,255,.8);font-size:12px;display:block}
.onair .gmv{text-align:right;font-family:var(--f-display);font-weight:700;font-size:15px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;color:var(--text)}
button.kpi:hover{border-color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,1.9vw,26px);line-height:1.1;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}

/* ---------- tabela / jornada ---------- */
.tblwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:660px}
th{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raised2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:11px;flex:none;color:#fff}
.who b{display:block;font-size:13px;white-space:nowrap}
.who small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
td.mk{min-width:190px}
.steps{display:flex;align-items:flex-start;width:230px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:10px;color:var(--muted);min-width:0;padding-bottom:16px}
.st::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--step)}
.st i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--raised);position:relative;z-index:1}
.st.done i{background:var(--step);border-color:var(--step)}
.st.cur i{background:var(--volt);border-color:var(--on-brand);outline:2px solid var(--flash);outline-offset:1px}
.st span{position:absolute;top:19px;left:50%;transform:translateX(-50%);white-space:nowrap;visibility:hidden}
.st.cur span{visibility:visible;color:var(--text);font-weight:700}
.next b{display:block;font-size:12px}.next small{color:var(--muted);font-size:11px;display:block}
.next{min-width:170px}
.next small{max-width:260px;white-space:normal}

/* ---------- widgets ---------- */
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.quad.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .d{display:flex;flex-direction:column;gap:6px;min-width:0}
.dh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dh b{display:block;font-family:var(--f-display);font-size:16px;color:var(--text)}
.dh.today b{color:var(--accent-text)}
.ev{border-radius:10px;padding:6px 7px;font-size:11px;line-height:1.25;background:var(--raised2);border:0;border-left:3px solid var(--muted);min-width:0;text-align:left;color:var(--text);width:100%}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .sub{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .sub .w{color:var(--warn)}
.ev em{font-style:normal;display:block;margin-top:5px}
.ev.c-ok{border-left-color:var(--ok)} .ev.c-warn{border-left-color:var(--warn)} .ev.c-live{border-left-color:var(--flash);background:var(--flash-bg)} .ev.c-done{border-left-color:var(--info);opacity:.8} .ev.c-x{border-left-color:var(--bad);opacity:.55;text-decoration:line-through}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.room{border-radius:10px;border:1px solid var(--line);padding:7px 4px;text-align:center;font-size:10px;background:var(--raised2);color:var(--muted)}
.room b{display:block;font-family:var(--f-display);font-size:12px;color:var(--text)}
.room.busy{background:var(--volt);color:var(--on-brand);border-color:var(--volt)} .room.busy b{color:var(--on-brand)}
.room.onair{background:var(--flash);color:var(--on-brand);border-color:var(--flash)} .room.onair b{color:var(--on-brand)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.money div{display:flex;flex-direction:column;gap:2px;min-width:0}
.money b{font-family:var(--f-display);font-size:17px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:12px}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:10px;border-radius:var(--r-pill);background:var(--raised2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar);border-radius:var(--r-pill)}
.bar .v{text-align:right;font-weight:700}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- rail ---------- */
.today .t{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.today .t:last-child{border-bottom:0}
.today .h{font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}
.today b{display:block;font-size:13px}
.today small{display:block;font-size:11px;color:var(--muted)}
.assist{background:var(--volt);color:var(--on-brand);border:2px solid var(--on-brand);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.assist .label{color:var(--on-brand);opacity:.7}
.assist b{font-family:var(--f-display);font-size:17px}
.assist ul{margin:0;padding-left:16px;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.assist ul button{display:inline;background:none;border:0;padding:0;color:var(--on-brand);font-weight:600;text-align:left;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.chat .m{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.chat .m:last-child{border-bottom:0}
.chat b{font-size:12px;display:block}.chat p{margin:0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.chat time{font-size:10px;color:var(--muted);white-space:nowrap}
.chat .clip p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- módulos ---------- */
.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mh p{margin:6px 0 0;color:var(--muted);max-width:66ch}
.mh .acts{display:flex;gap:10px;flex-wrap:wrap}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h3{display:flex;justify-content:space-between}
.kc{background:var(--raised2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid transparent;color:var(--text);align-items:flex-start}
.kc:hover{border-color:var(--muted)}
.kc .v{font-family:var(--f-display);font-weight:700;font-size:13px}
.agcol{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.agcol .d{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.agcol .dh{text-align:left;font-size:12px}
.agcol .ev{padding:8px 9px;font-size:12px;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.roomcard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
.roomcard .code{font-family:var(--f-display);font-weight:800;font-size:20px}
.roomcard.busy{border-color:var(--volt)} .roomcard.onair{border-color:var(--flash)}
.slots{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-top:4px}
.slots i{height:8px;border-radius:2px;background:var(--raised2)}
.slots i.b{background:var(--bar)} .slots i.a{background:var(--flash)}
.slotlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.note{background:var(--raised2);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--muted)}
.note b{color:var(--text)}
.weeknav{display:flex;align-items:center;gap:8px}

/* ---------- formulários / gavetas ---------- */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(500px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);padding:22px 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}

.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px}
.toggle input{width:20px;height:20px;accent-color:var(--volt)}
.err{color:var(--bad);font-size:13px;margin:0;font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.callout{border:1px solid var(--warn);background:var(--warn-bg);border-radius:14px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--volt);color:var(--on-brand);border:2px solid var(--on-brand);box-shadow:4px 4px 0 var(--flash);border-radius:var(--r-pill);padding:10px 18px;font-weight:700;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- entrada ---------- */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px}
.gate .box{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}

.tabs{display:flex;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px}

.pg .lg svg{width:20cqw;height:auto}
.pg .noar{position:absolute;right:8cqw;top:42%;background:#FF3FA4;color:#0B0B0C;font-weight:800;font-size:1.8cqw;border-radius:99px;padding:.8cqw 2cqw;transform:rotate(-6deg);border:.25cqw solid #0B0B0C}
.pg.fim .noar{top:auto;bottom:12cqw;right:8cqw;background:#D4FF2F}
.pg .spark{position:absolute;right:6cqw;top:30%;width:5cqw;height:5cqw}
.pg .rod{font-size:1.3cqw;color:rgba(255,255,255,.8);margin:0}
.pg .ct{font-size:1.55cqw;line-height:1.6;margin:0}
#printdoc{display:none}
@media print{
  @page{size:297mm 167.06mm;margin:0}

  #printdoc .pg{width:297mm;height:167.06mm;aspect-ratio:auto;border-radius:0;break-after:page;page-break-after:always}
}

.cod{font-family:var(--f-display);font-weight:800;font-size:12px;background:var(--raised2);border:1px solid var(--line);border-radius:8px;padding:6px 7px;flex:none;letter-spacing:.02em}

.ev .num{font-family:var(--f-display);font-size:10px;color:var(--muted);margin-right:2px}

@media (max-width:1400px){ .page{grid-template-columns:minmax(0,1fr)} .rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))} }

<script>

/* =========================================================================

const CFG_=window.IMPLAY_CONFIG||{};

/* ---------------- constantes ---------------- */
const ETAPAS=['Agendado','Equipe ok','Realizado','Faturado','Pago'];
const TIPOS={live:'Live',consultoria:'Consultoria',podcast:'Podcast',evento:'Evento',outro:'Outro'};

const REM_T={nenhuma:'Sem remuneração',fixo:'Fixo',variavel:'% sobre vendas',misto:'Fixo + %'};
const FUNC={seller:'Seller',operador:'Operador'};
const SALAS=[...Array.from({length:11},(_,i)=>'E'+(i+1)),...Array.from({length:6},(_,i)=>'P'+(i+1)),'B1','B2','C1','Esc1','Esc2','Esc3'];
const NIVEL={adm:'ADM',manager:'Gerência',basic:'Consulta',seller:'Seller'};
const PAPEL={seller:'Seller',operador:'Operador',editor:'Editor',outro:'Outro'};
const PROP_ST={rascunho:['Rascunho','mute'],enviada:['Enviada','info'],negociacao:['Negociação','warn'],aceita:['Aceita','ok'],perdida:['Perdida','bad'],substituida:['Substituída','mute']};
const CORES=[
 '#C8102E','#E63946','#FF6B6F','#FF5A1F','#F08C00','#FFB23F','#F4D03F','#D4FF2F','#9BE15D','#3DDC97',
 '#0E9F6E','#1B5E20','#2E7D6B','#00B8A9','#0B7285','#7FD8FF','#1E88E5','#2B3BFF','#1A237E',
 '#7A3BFF','#9C27B0','#C9A0FF','#FF3FA4','#E91E63','#F8BBD0','#AD1457','#8A5A2B','#C49A6C','#E8D5B7',
 '#6D4C41','#3E2723','#78909C','#55555C','#263238','#0B0B0C','#F7F7F2'];
const corTexto=c=>{const h=String(c||'').replace('#','');if(h.length<6)return '#fff';const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4);return (.2126*r+.7152*g+.0722*b)>.4?'#0B0B0C':'#fff'};
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
const DIASX=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

const PCORES=['#D4FF2F','#FF3FA4','#8C97FF','#3DDC97','#FFB23F','#FF6B6F','#7FD8FF','#C9A0FF'];

/* ---------------- estado ---------------- */
let sb=null, SESSION=null, ME=null;
let D={profiles:[],marcas:[],props:[],free:[],trab:[],eq:[],cands:[],pags:[],recs:[],recados:[],log:[],desp:[],reemb:[],conv:[],config:[],contratos:[],conds:[]};
const UI={status:'carregando',view:'painel',q:'',filtro:'todas',tipo:'todos',mesT:0,semana:0,relMes:0,layer:null,confirm:null,lmode:'senha',email:'',aviso:'',erro:'',verCanc:false};

/* ---------------- utilidades ---------------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dObj=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const hoje=()=>dkey(new Date());
const addD=(k,n)=>{const d=dObj(k);d.setDate(d.getDate()+n);return dkey(d)};
const hm=t=>(t||'').slice(0,5);
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dCurto=k=>{const d=dObj(k);return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`};
const dExt=k=>{if(!k)return '';const d=dObj(k);return `${DIASX[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():''}`};
const quando=k=>{if(!k)return '';const h=hoje();return k===h?'Hoje':k===addD(h,1)?'Amanhã':k===addD(h,-1)?'Ontem':dCurto(k)};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:Number(v)%1?2:0});
const moneyK=v=>{v=Number(v||0);return Math.abs(v)>=10000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':money(v)};
const parseValor=s=>{s=String(s??'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)||s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:NaN};
const valIn=v=>v||v===0?String(Number(v)).replace('.',','):'';
const horas=(i,f)=>{const[a,b]=hm(i).split(':').map(Number),[c,d]=hm(f).split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m/60};
const fmtH=h=>(Math.round(h*10)/10).toLocaleString('pt-BR')+'h';
const ini=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const sigla=n=>{const w=(n||'?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/);if(/^[A-Z0-9]{2,3}$/.test(w[0]))return w[0];return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase()};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const match=(...xs)=>!UI.q||norm(xs.join(' ')).includes(norm(UI.q));

const isAdm=()=>ME&&ME.nivel==='adm';
const canOp=()=>ME&&(ME.nivel==='adm'||ME.nivel==='manager');
const isSeller=()=>ME&&ME.nivel==='seller';

const marca=id=>D.marcas.find(m=>m.id===id)||{nome:'—',cor:'#55555C',segmento:''};
const trab=id=>D.trab.find(t=>t.id===id);
const cod=n=>String(n||0).padStart(4,'0');
const free=id=>id?(D.free.find(f=>f.id===id)||{id,nome:'—',papel:'outro',ativo:false}):undefined;
const prof=id=>D.profiles.find(p=>p.id===id);
const pNome=id=>(prof(id)||{}).nome||'—';
const pCor=id=>{const i=D.profiles.findIndex(p=>p.id===id);return PCORES[(i<0?0:i)%PCORES.length]};
const fCor=id=>{const i=D.free.findIndex(p=>p.id===id);return PCORES[(i<0?3:i+3)%PCORES.length]};
const meuFreela=()=>ME&&D.free.find(f=>f.email&&f.email.toLowerCase()===String(ME.email||'').toLowerCase());

const pill=(t,c)=>`<span class="pill p-${c}">${esc(t)}</span>`;
const logo=id=>{const m=marca(id);return `<span class="logo" style="background:${esc(m.cor)};color:${corTexto(m.cor)};box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)" aria-hidden="true">${esc(sigla(m.nome))}</span>`};

const steps=e=>`<div class="steps" style="width:190px" role="img" aria-label="Etapa: ${ETAPAS[e]}">${ETAPAS.map((s,i)=>`<div class="st ${i<e?'done':i===e?'cur':''}" title="${s}"><i></i><span>${s}</span></div>`).join('')}</div>`;

/* ---------------- ícones ---------------- */
const IC={
 home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 brand:'<path d="M4 7h16v13H4z"/><path d="M9 7V4h6v3"/>',
 doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 team:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.5c2.7 0 4.4 1.6 5 4.5"/>',
 room:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h9"/>',
 money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',

async function loadAll(){
  const s=(t,ord,asc=true,lim=5000)=>sb.from(t).select('*').order(ord,{ascending:asc}).limit(lim);
  const desde=addD(hoje(),-500);
  const reqs={
    profiles:s('profiles','nome'), marcas:s('marcas','nome'), free:s('freelancers','nome'),
    trab:sb.from('trabalhos').select('*').gte('data',desde).order('data').order('ini').limit(5000),
    eq:s('trabalho_equipe','criado_em'), cands:s('candidaturas','criado_em',false), pags:s('pagamentos_freela','competencia',false),
  };
  if(!isSeller()) Object.assign(reqs,{props:s('propostas','numero',false),recados:s('recados','criado_em',false,60),log:s('central_log','em',false,400),config:s('config','chave'),contratos:s('contratos','numero',false),conds:s('contrato_condicoes','vale_desde'),conv:s('convites','nome')});
  if(isAdm()) Object.assign(reqs,{recs:s('recebimentos','vencimento'),desp:sb.from('despesas').select('id,valor,origem,pagador_id,pagador_nome,aprov').eq('origem','pessoal').limit(10000),reemb:sb.from('reembolsos').select('id,valor,pessoa_id,pessoa_nome').limit(10000)});
  const ks=Object.keys(reqs), rs=await Promise.all(ks.map(k=>reqs[k]));
  const first=rs.find(r=>r.error&&/relation|does not exist|schema cache/i.test(r.error.message));
  if(first) throw new Error(/trabalh/i.test(first.error.message)?'Falta rodar o arquivo supabase/central-3.sql no Supabase (projeto implay).':/contrat|config/i.test(first.error.message)?'Falta rodar o arquivo supabase/central-2.sql no Supabase.':'As tabelas da Central ainda não existem. Rode os arquivos central-1, 2 e 3 no Supabase.');
  ks.forEach((k,i)=>{ if(!rs[i].error) D[k]=rs[i].data||[]; });
  ME=D.profiles.find(p=>p.id===SESSION.user.id)||ME;
}

async function save(table,row,id){
  const q=id?sb.from(table).update(row).eq('id',id).select().maybeSingle():sb.from(table).insert(row).select().single();
  const {data,error}=await q;
  if(error){toast(trErr(error.message),true);return null}
  return data||{};
}
function trErr(m){
  if(/row-level security|permission|violates row/i.test(m))return 'Seu nível de acesso não permite essa ação.';
  if(/duplicate key/i.test(m))return 'Isso já foi registrado.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão. Tente de novo.';
  if(/check constraint/i.test(m))return 'Algum campo obrigatório ficou vazio ou inválido.';
  return m;
}

const vivos=()=>D.trab.filter(t=>t.status!=='cancelado');
const eqDe=(tid,f)=>D.eq.filter(e=>e.trabalho_id===tid&&(!f||e.funcao===f));
const vagas=(t,f)=>Math.max(0,(f==='seller'?t.vagas_seller:t.vagas_operador)-eqDe(t.id,f).length);
const vagasTot=t=>vagas(t,'seller')+vagas(t,'operador');
const realizado=t=>['realizado','faturado','pago'].includes(t.status);
const durH=t=>t.ini&&t.fim?horas(t.ini,t.fim):0;
const ganho=t=>(['fixo','misto'].includes(t.remun)?Number(t.fixo||0):0)+(['variavel','misto'].includes(t.remun)?Number(t.gmv||0)*Number(t.comissao||0)/100:0);
function remTxt(t,curto){
  if(t.remun==='nenhuma')return 'Sem remuneração';
  const f=money(t.fixo), c=pctTxt(t.comissao)+(curto?' das vendas':' sobre as vendas');
  return t.remun==='fixo'?f:t.remun==='variavel'?c:f+' + '+c;
}
function etapaT(t){
  if(t.status==='pago')return 4;if(t.status==='faturado')return 3;if(t.status==='realizado')return 2;if(t.status==='andamento')return 1;
  return vagasTot(t)===0?1:0;
}
function semVaga(dias){const h=hoje(),f=addD(h,dias);return D.trab.filter(t=>t.status==='agendado'&&t.data>=h&&t.data<=f&&vagasTot(t)>0)}
function mesPrefixo(off=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return {p:dkey(d).slice(0,7),nome:MESES[d.getMonth()]}}
const doMes=(off=0)=>{const {p}=mesPrefixo(off);return D.trab.filter(t=>realizado(t)&&t.data.startsWith(p))};
const gmvMes=(off=0)=>doMes(off).reduce((s,t)=>s+Number(t.gmv||0),0);
function saldoSocios(){
  const m={};const k=(id,n)=>id?'i:'+id:'n:'+norm(n);
  const add=(key,nome,v)=>{(m[key]=m[key]||{nome,v:0}).v+=v};
  D.desp.filter(d=>d.aprov!=='recusada').forEach(d=>add(k(d.pagador_id,d.pagador_nome),d.pagador_id?pNome(d.pagador_id):d.pagador_nome,Number(d.valor)));
  D.reemb.forEach(r=>add(k(r.pessoa_id,r.pessoa_nome),r.pessoa_id?pNome(r.pessoa_id):r.pessoa_nome,-Number(r.valor)));
  return Object.values(m).filter(x=>Math.abs(x.v)>0.004).sort((a,b)=>b.v-a.v);
}
function pessoasInternas(){
  const nomes=new Map();
  D.profiles.filter(p=>p.status==='ativo'&&p.nivel!=='seller').forEach(p=>nomes.set(norm(p.nome),p.nome));
  D.conv.filter(c=>c.nivel!=='seller').forEach(c=>{if(!nomes.has(norm(c.nome)))nomes.set(norm(c.nome),c.nome)});
  return [...nomes.values()].sort((a,b)=>a.localeCompare(b));
}
function pendencias(){

  D.props.filter(p=>['enviada','negociacao'].includes(p.status)&&p.validade&&p.validade<=addD(h,5)).forEach(p=>P.push({t:`Proposta P-${pad(p.numero)} ${marca(p.marca_id).nome} vence ${quando(p.validade).toLowerCase()}`,go:'propostas'}));

    const at=D.recs.filter(r=>r.status==='a receber'&&r.vencimento<h);if(at.length)P.push({t:`${at.length} recebimento${at.length>1?'s':''} atrasado${at.length>1?'s':''} (${money(at.reduce((s,r)=>s+Number(r.valor),0))})`,go:'financeiro'});
    const nn=new Set(D.pags.filter(p=>p.status==='a pagar'&&!p.nf_recebida).map(p=>p.freelancer_id)).size;if(nn)P.push({t:`${nn} freelancer${nn>1?'s':''} sem NF`,go:'financeiro'});

function roomsMini(){
  const h=hoje(),st={};
  vivos().filter(t=>t.data===h&&t.local==='paulista'&&t.sala).forEach(t=>{st[t.sala]=t.status==='andamento'?'onair':(st[t.sala]==='onair'?'onair':'busy')});
  return `<div class="rooms">${SALAS.map(s=>`<div class="room ${st[s]||''}"><b>${s}</b>${st[s]==='onair'?'no ar':st[s]==='busy'?'reservada':'livre'}</div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--flash)"></i>no ar</span><span><i style="background:var(--volt)"></i>reservada hoje</span><span><i style="background:var(--raised2);border:1px solid var(--line)"></i>livre</span></div>`;
}
function dinheiroCard(){
  const h=hoje(), rec=D.recs.filter(r=>r.status==='a receber'), at=rec.filter(r=>r.vencimento<h);
  const pag=D.pags.filter(p=>p.status==='a pagar'), soc=saldoSocios().filter(x=>x.v>0);
  const fat=D.trab.filter(t=>t.status==='realizado');
  return `<section class="card"><div class="card-h"><h2>Dinheiro</h2><button class="link" data-go="financeiro">Financeiro ›</button></div>
   <div class="money">
     <div><span class="label">A receber</span><b class="num">${moneyK(rec.reduce((s,r)=>s+Number(r.valor),0))}</b><small class="muted">${at.length?`<span style="color:var(--bad)">${money(at.reduce((s,r)=>s+Number(r.valor),0))} atrasado</span>`:'nada atrasado'}</small></div>
     <div><span class="label">Para faturar</span><b class="num">${moneyK(fat.reduce((s,t)=>s+ganho(t),0))}</b><small class="muted">${fat.length} trabalho(s) realizado(s)</small></div>
     <div><span class="label">Freelancers a pagar</span><b class="num">${moneyK(pag.reduce((s,p)=>s+Number(p.valor),0))}</b><small class="muted">${new Set(pag.map(p=>p.freelancer_id)).size} pessoa(s)</small></div>
     <div><span class="label">Implay deve aos sócios</span><b class="num">${moneyK(soc.reduce((s,x)=>s+x.v,0))}</b><small class="muted">${soc.map(x=>esc(x.nome)).join(', ')||'nada'}</small></div>
   </div></section>`;
}
function equipeMes(){
  const {p}=mesPrefixo();
  return D.free.filter(f=>f.ativo).map(f=>{
    const ids=new Set(D.eq.filter(e=>e.freelancer_id===f.id).map(e=>e.trabalho_id));
    const ts=D.trab.filter(t=>ids.has(t.id)&&t.status!=='cancelado'&&t.data.startsWith(p));
    const cs=D.cands.filter(c=>c.freelancer_id===f.id);
    const pg=D.pags.filter(x=>x.freelancer_id===f.id&&x.status==='a pagar');
    return {f,n:ts.length,h:ts.reduce((s,t)=>s+durH(t),0),gmv:ts.reduce((s,t)=>s+Number(t.gmv||0),0),cand:cs.length,aceitas:cs.filter(c=>c.status==='aceita').length,retiradas:cs.filter(c=>c.status==='retirada').length,aPagar:pg.reduce((s,x)=>s+Number(x.valor),0),nfPend:pg.some(x=>!x.nf_recebida)};
  }).sort((a,b)=>b.n-a.n||a.f.nome.localeCompare(b.f.nome));
}

   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
     <div class="chips" role="group" aria-label="Filtro">${[['todas','Todos'],['vagas','Com vaga'],['live','Lives'],['outros','Outros tipos'],['paulista','Na Paulista'],['fora','Fora'],['canceladas','Cancelados']].map(([k,t])=>`<button data-filtro="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>

   </div>

   <div class="note"><b>Registro de escolha livre.</b> Cada candidatura, confirmação, recusa e desistência fica guardada com data e hora no Histórico. É a prova de que cada freelancer escolhe os próprios trabalhos.</div>

V.estudios=()=>{
  const h=UI.estDia||hoje();
  const ts=vivos().filter(t=>t.data===h&&t.local==='paulista');
  const H0=8,HN=16;
  const ocup=s=>{const arr=Array(HN).fill('');ts.filter(t=>t.sala===s&&t.ini).forEach(t=>{const a=+hm(t.ini).slice(0,2),b=Math.ceil(durH(t)+(+hm(t.ini).slice(3))/60);for(let i=0;i<b;i++){const k=a+i-H0;if(k>=0&&k<HN)arr[k]=t.status==='andamento'?'a':'b'}});return arr};
  return `<div class="col full">
   <div class="mh"><div><h1>Estúdios</h1><p>Salas da Paulista 2200. A ocupação vem dos trabalhos marcados em cada sala.</p></div>
     <div class="acts"><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span>Dia</span><input type="date" id="estdia" value="${h}" style="width:auto"></label></div></div>
   <p class="muted" style="margin:0">${dExt(h)} · linha do dia das 8h às 24h</p>
   <div class="grid3">${SALAS.map(s=>{const lx=ts.filter(t=>t.sala===s),on=lx.some(t=>t.status==='andamento');return `<div class="roomcard ${on?'onair':lx.length?'busy':''}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="code">${s}</span>${on?'<span class="live"><i></i>NO AR</span>':lx.length?pill(lx.length+' trabalho'+(lx.length>1?'s':''),'ok'):pill('Livre','mute')}</div>${lx.map(t=>`<button class="link" style="text-align:left;color:var(--text);font-weight:600;font-size:12px" data-trab="${t.id}">${cod(t.codigo)} · ${t.ini?hm(t.ini)+'–'+hm(t.fim)+' · ':''}${esc(marca(t.marca_id).nome)}</button>`).join('')||'<small class="muted">Sem reserva</small>'}<div class="slots">${ocup(s).map(x=>`<i class="${x}"></i>`).join('')}</div><div class="slotlbl"><span>8h</span><span>16h</span><span>24h</span></div></div>`}).join('')}</div>
  </div>`;
};

function abrir(kind,type,id,extra){UI.layer={kind,type,id,extra};UI.confirm=null;renderLayer()}
function fechar(){UI.layer=null;UI.confirm=null;document.getElementById('layer').innerHTML=''}
function renderLayer(){
  const L=UI.layer;if(!L){fechar();return}
  const fn=L.kind==='det'?DET[L.type]:FORM[L.type];
  const body=fn(L.id,L.extra||{});if(body==null){fechar();return}
  const wasOpen=!!document.querySelector('#layer .drawer'), sc=wasOpen?document.querySelector('#layer .drawer').scrollTop:0;
  document.getElementById('layer').innerHTML=`<div class="scrim" data-scrim><div class="drawer" role="dialog" aria-modal="true">${body}</div></div>`;
  const dr=document.querySelector('#layer .drawer');dr.scrollTop=sc;
  if(!wasOpen){const f=dr.querySelector('input:not([type=hidden]),select,textarea,button');f&&f.focus({preventScroll:true})}
  syncForm();
}

  const k=cid&&condEm(cid,data||hoje());if(!k)return null;

  return {remun:k.remun==='fixo'?'nenhuma':'variavel',fixo:0,comissao:k.remun==='fixo'?0:k.comissao,nota:k.remun!=='variavel'?`O fixo mensal de ${money(k.fixo)} é cobrado no contrato, não em cada trabalho.`:''};
}

async function genSalvar(st){

  const dados={...G};['id','numero','versao','origem_id','status'].forEach(k=>delete dados[k]);
  const row={marca_id:G.marca_id,escopo:pacoteTxt(G),valor:G.remun==='variavel'?0:(G.formato==='recorrente'?G.fixo*G.vigencia:G.fixo),validade:addD(hoje(),Number(G.validade_dias)||10),
    formato:G.formato,remun:G.remun,fixo:G.remun==='variavel'?0:G.fixo,fixo_periodo:G.formato==='dia'?'projeto':'mes',comissao:G.remun==='fixo'?0:G.comissao,vigencia:G.vigencia,dados,atualizado_em:new Date().toISOString()};
  let r;
  if(G.id&&G.status!=='rascunho'){
    r=await save('propostas',{...row,status:st,numero:G.numero,versao:G.versao+1,origem_id:G.origem_id||G.id});
    if(r)await sb.from('propostas').update({status:'substituida'}).eq('id',G.id);
  }else r=await save('propostas',{...row,status:st},G.id);
  if(!r)return;
  await loadAll();const p=D.props.find(x=>x.id===(r.id||G.id));if(p)UI.gen=genDeProposta(p);
  redraw();toast(st==='enviada'?`Proposta P-${pad(p.numero)} v${p.versao} salva como enviada`:'Rascunho salvo');

function genChip(t){
  const G=UI.gen,k=t.dataset.g;let v=t.dataset.gv;if(['vigencia'].includes(k))v=Number(v);
  if(t.dataset.gm){const a=new Set(G.inclui||[]);a.has(v)?a.delete(v):a.add(v);G.inclui=[...a];redraw();return}
  G[k]=v;
  if(k==='pacote'&&v!=='Personalizado'){const p=cfgP().pacotes.find(x=>x.nome===v);if(p){G.lives=p.lives;G.horas=p.horas;if(p.fixo>0)G.fixo=p.fixo;if(p.pct>0)G.comissao=p.pct}}

}

   ========================================================================= */
function drawSeller(){
  const app=document.getElementById('app'), eu=meuFreela(), h=hoje();
  const tab=['vagas','meus','ganhos'].includes(UI.view)?UI.view:'vagas';
  const meus=new Set(D.eq.filter(e=>eu&&e.freelancer_id===eu.id).map(e=>e.trabalho_id));
  const fn=eu&&eu.papel==='operador'?'operador':'seller';
  const onde=t=>t.local==='paulista'?'Paulista 2200 · '+esc(t.sala||'sala a definir'):t.local==='cliente'?'no local do cliente'+(t.local_txt?' · '+esc(t.local_txt):''):t.local==='remoto'?'remoto':esc(t.local_txt||'outro local');
  let body='';
  if(!eu) body=`<div class="selcard"><b>Seu cadastro de freelancer ainda não foi ligado a este e-mail.</b><p class="muted" style="margin:0">Peça para a Implay cadastrar você em "Equipe freelancer" com o e-mail ${esc(ME.email)}.</p></div>`;
  else if(tab==='vagas'){
    const ts=D.trab.filter(t=>t.status==='agendado'&&t.data>=h&&!meus.has(t.id)&&(fn==='seller'?t.vagas_seller:t.vagas_operador)>0).sort((a,b)=>(a.data+(a.ini||'')).localeCompare(b.data+(b.ini||'')));
    body=ts.map(t=>{const c=D.cands.find(x=>x.trabalho_id===t.id&&x.freelancer_id===eu.id);const hh=durH(t);
      return `<div class="selcard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="when">${esc(quando(t.data))}${t.ini?' · '+hm(t.ini)+'–'+hm(t.fim):''}</span>${logo(t.marca_id)}</div>
       <div><b>${cod(t.codigo)} · ${TIPOS[t.tipo]} · ${esc(marca(t.marca_id).nome)}</b><div class="muted" style="font-size:13px">${esc(dExt(t.data))} · ${onde(t)}${hh?' · '+fmtH(hh):''}${eu.valor_hora&&hh?' · '+money(hh*eu.valor_hora):''}</div>${t.obs?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(t.obs)}</div>`:''}</div>
       ${!c?`<button class="btn sticker wide" data-act="candidatar" data-id="${t.id}">Quero essa vaga</button>`:c.status==='pendente'?`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">${pill('Candidatura enviada','info')}<button class="btn sm ghost" data-act="retirar" data-id="${c.id}">Desistir</button></div>`:c.status==='retirada'?`<button class="btn wide" data-act="recandidatar" data-id="${c.id}">Me candidatar de novo</button>`:pill('Não foi dessa vez','mute')}</div>`}).join('')||`<div class="selcard"><b>Nenhuma vaga aberta agora.</b><p class="muted" style="margin:0">Quando a Implay abrir uma vaga de ${FUNC[fn].toLowerCase()}, ela aparece aqui.</p></div>`;
  }else if(tab==='meus'){
    const ts=D.trab.filter(t=>meus.has(t.id)&&t.status!=='cancelado');
    const fut=ts.filter(t=>t.data>=h).sort((a,b)=>(a.data+(a.ini||'')).localeCompare(b.data+(b.ini||''))), pas=ts.filter(t=>t.data<h).sort((a,b)=>b.data.localeCompare(a.data));
    const card=t=>`<div class="selcard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="when">${esc(quando(t.data))}${t.ini?' · '+hm(t.ini)+'–'+hm(t.fim):''}</span>${t.status==='andamento'?'<span class="live"><i></i>NO AR</span>':pill(FUNC[(D.eq.find(e=>e.trabalho_id===t.id&&e.freelancer_id===eu.id)||{}).funcao]||'','ok')}</div><div><b>${cod(t.codigo)} · ${TIPOS[t.tipo]} · ${esc(marca(t.marca_id).nome)}</b><div class="muted" style="font-size:13px">${esc(dExt(t.data))} · ${onde(t)}</div>${t.obs?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(t.obs)}</div>`:''}</div></div>`;
    body=`<h2>Próximos</h2>${fut.map(card).join('')||'<p class="empty">Nenhum trabalho confirmado.</p>'}${pas.length?`<h2>Feitos</h2>${pas.slice(0,20).map(card).join('')}`:''}`;
  }else{
    const ps=D.pags.filter(p=>p.freelancer_id===eu.id&&p.status!=='cancelado').sort((a,b)=>b.competencia.localeCompare(a.competencia));
    const ap=ps.filter(p=>p.status==='a pagar');
    body=`<div class="selcard"><span class="label">A receber da Implay</span><span class="when" style="font-size:24px">${money(ap.reduce((s,p)=>s+Number(p.valor),0))}</span>${ap.some(p=>!p.nf_recebida)?'<span class="muted" style="font-size:12px">Envie a NF para a Implay liberar o pagamento.</span>':''}</div>
      ${ps.map(p=>`<div class="selcard" style="flex-direction:row;align-items:center"><div style="flex:1;min-width:0"><b style="font-size:13px">${esc(p.descricao||'Pagamento')}</b><div class="muted" style="font-size:12px">${dCurto(p.competencia)}${p.pago_em?' · pago '+dCurto(p.pago_em):''}</div></div><div style="text-align:right"><b class="num">${money(p.valor)}</b><div>${p.status==='pago'?pill('Pago','ok'):pill('A pagar','warn')}</div></div></div>`).join('')}`;
  }
  app.innerHTML=`<header class="top" style="position:sticky"><button class="brand" data-go="vagas" style="padding:0">${LOGO.replace('<svg ','<svg style="width:90px" ')}</button><span class="sp"></span><button class="ibtn" data-act="tema" aria-label="Trocar tema">${ic('moon')}</button><button class="btn sm ghost" data-act="logout">Sair</button></header>
   <div class="sel"><div><span class="label">Olá, ${esc((eu||ME).nome||'')}${eu?' · '+FUNC[fn]:''}</span><h1 style="margin-top:4px">${tab==='vagas'?'Vagas abertas':tab==='meus'?'Meus trabalhos':'Meus pagamentos'}</h1></div>
   <nav class="tabs" aria-label="Seções">${[['vagas','Vagas'],['meus','Meus trabalhos'],['ganhos','Pagamentos']].map(([k,t])=>`<button data-go="${k}" ${tab===k?'aria-current="page"':''}>${t}</button>`).join('')}</nav>
   ${body}<p class="muted" style="font-size:11px;text-align:center">Você escolhe os trabalhos que quer fazer. Toda candidatura fica registrada.</p></div>`;
}

let tt;
function toast(m,bad){clearTimeout(tt);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.classList.toggle('bad',!!bad);tt=setTimeout(()=>t.remove(),2800)}
async function depois(msg){await loadAll();redraw();if(UI.layer)renderLayer();if(msg)toast(msg)}
async function escalar(tid,fid,f){
  const t=trab(tid);
  if(vagas(t,f)===0){const k=f==='seller'?'vagas_seller':'vagas_operador';if(t[k]>=5){toast('Já são 5 vagas de '+FUNC[f].toLowerCase()+'. Tire alguém antes.',true);return false}await sb.from('trabalhos').update({[k]:t[k]+1}).eq('id',tid);t[k]++}
  const {error}=await sb.from('trabalho_equipe').insert({trabalho_id:tid,freelancer_id:fid,funcao:f});
  if(error){toast(trErr(error.message),true);return false}return true;
}
async function faturarTrabs(ts,marca_id,contrato_id,descricao,valor,venc){
  const r=await save('recebimentos',{marca_id,contrato_id:contrato_id||null,trabalho_ids:ts.map(t=>t.id),descricao,valor:Math.round(valor*100)/100,vencimento:venc});
  if(!r)return false;
  if(ts.length){const {error}=await sb.from('trabalhos').update({status:'faturado'}).in('id',ts.map(t=>t.id).filter(id=>trab(id).status==='realizado'));if(error)toast(trErr(error.message),true)}
  return true;
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-go],[data-g],[data-contrato],[data-trab],[data-marca],[data-prop],[data-free],[data-rec],[data-pag],[data-filtro],[data-lmode],[data-group] button,[data-mgroup] button,[data-scrim]');
  if(!t)return;
  if(t.hasAttribute('data-scrim')){if(e.target===t)fechar();return}
  if(t.closest('[data-mgroup]')&&t.dataset.v!==undefined){e.preventDefault();t.setAttribute('aria-pressed',String(t.getAttribute('aria-pressed')!=='true'));return}
  if(t.closest('[data-group]')&&t.dataset.v!==undefined){e.preventDefault();t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));if(t.parentElement.dataset.group==='cor'){const ci=document.getElementById('mc-cor');if(ci)ci.value=t.dataset.v}syncForm();return}
  if(t.dataset.lmode){const el=document.getElementById('l-email');if(el)UI.email=el.value.trim();UI.lmode=t.dataset.lmode;UI.aviso='';draw();return}
  if(t.dataset.go){UI.view=t.dataset.go;UI.filtro=t.dataset.f||'todas';UI.semana=0;fechar();draw();window.scrollTo(0,0);return}
  if(t.dataset.filtro){UI.filtro=t.dataset.filtro;draw();return}
  if(t.dataset.g){genChip(t);return}
  if(t.dataset.trab&&!t.dataset.act){abrir('det','trab',t.dataset.trab);return}
  if(t.dataset.contrato&&!t.dataset.act){abrir('det','contrato',t.dataset.contrato);return}
  if(t.dataset.marca){abrir('form','marca',t.dataset.marca);return}
  if(t.dataset.prop){abrir('det','prop',t.dataset.prop);return}
  if(t.dataset.free){abrir('form','free',t.dataset.free);return}
  if(t.dataset.rec){abrir('form','rec',t.dataset.rec);return}
  if(t.dataset.pag){abrir('form','pag',t.dataset.pag);return}
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'fechar': fechar(); return;
    case 'confirm': UI.confirm=t.dataset.c; renderLayer(); return;
    case 'tema': {const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('implay-tema',n)}catch(e){}return}
    case 'logout': await sb.auth.signOut(); return;
    case 'reload': start(); return;
    case 'novotrab': abrir('form','trab',null,{d:t.dataset.d,contrato:t.dataset.contrato}); return;
    case 'edittrab': abrir('form','trab',id); return;
    case 'duptrab': abrir('form','trab',null,{copia:id}); return;
    case 'novamarca': case 'novapessoa': UI.voltar=UI.layer&&UI.layer.kind==='form'?{...UI.layer,snap:snapForm()}:null; abrir('form',a==='novamarca'?'marca':'pessoa',null); return;
    case 'novofree': abrir('form','free',null); return;
    case 'novorec': abrir('form','rec',null); return;
    case 'novopag': abrir('form','pag',null); return;
    case 'verpags': abrir('det','pags',t.dataset.f); return;
    case 'vercanc': UI.verCanc=!UI.verCanc; draw(); return;
    case 'sem': UI.semana=t.dataset.d==='0'?0:UI.semana+Number(t.dataset.d); draw(); return;
    case 'mest': UI.mesT+=Number(t.dataset.d); draw(); return;
    case 'tipo': UI.tipo=t.dataset.t; draw(); return;
    case 'relmes': UI.relMes=Number(t.dataset.o); draw(); return;
    case 'encerrar': abrir('form','resultado',id); return;
    case 'noar': if(await save('trabalhos',{status:'andamento'},id)) depois('No ar!'); return;
    case 'reabrir': if(await save('trabalhos',{status:'agendado'},id)) depois('Trabalho reaberto'); return;
    case 'canceltrab': UI.confirm=null; if(await save('trabalhos',{status:'cancelado'},id)) depois('Trabalho cancelado'); return;
    case 'aceitar': if(await save('candidaturas',{status:'aceita'},id)) depois('Confirmado na equipe'); return;
    case 'recusar': if(await save('candidaturas',{status:'recusada'},id)) depois('Candidatura recusada'); return;
    case 'tirar': {const {error}=await sb.from('trabalho_equipe').delete().eq('id',id);if(error)toast(trErr(error.message),true);else depois('Retirado. A vaga voltou a ficar aberta.');return}
    case 'vaga': {const tr=trab(id),k=t.dataset.f==='seller'?'vagas_seller':'vagas_operador';if(await save('trabalhos',{[k]:Math.min(5,tr[k]+1)},id))depois('Vaga aberta');return}
    case 'puxarcontrato': {const f=document.getElementById('ftrab'),r=remDoContrato(v('tr-contrato'),v('tr-data'));if(!r){toast('Escolha um contrato com condição para essa data',true);return}
      f.querySelector(`[data-group="remun"] [data-v="${r.remun}"]`).click();document.getElementById('tr-fixo').value=valIn(r.fixo);document.getElementById('tr-pct').value=valIn(r.comissao);document.getElementById('tr-nota').textContent=r.nota||'';toast('Remuneração puxada do contrato');return}
    case 'faturartrab': {const tr=trab(id),venc=addD(hoje(),15);
      if(await faturarTrabs([tr],tr.marca_id,tr.contrato_id,`${cod(tr.codigo)} · ${TIPOS[tr.tipo]} ${dCurto(tr.data)}: ${remTxt(tr,1)}${tr.gmv!=null?' (GMV '+money(tr.gmv)+')':''}`,ganho(tr),venc))depois('Lançado em A receber: '+money(ganho(tr)));return}
    case 'recebido': {const r=D.recs.find(x=>x.id===id);if(await save('recebimentos',{status:'recebido',recebido_em:hoje()},id)){if(r&&(r.trabalho_ids||[]).length)await sb.from('trabalhos').update({status:'pago'}).in('id',r.trabalho_ids);depois('Marcado como recebido')}return}
    case 'cancelrec': UI.confirm=null; if(await save('recebimentos',{status:'cancelado'},id)){const r=D.recs.find(x=>x.id===id);if(r&&(r.trabalho_ids||[]).length)await sb.from('trabalhos').update({status:'realizado'}).in('id',r.trabalho_ids).eq('status','faturado');fechar();depois('Cancelado')} return;
    case 'nf': {const ps=D.pags.filter(p=>p.freelancer_id===t.dataset.f&&p.status==='a pagar');const val=t.getAttribute('aria-pressed')!=='true';const {error}=await sb.from('pagamentos_freela').update({nf_recebida:val}).in('id',ps.map(p=>p.id));if(error)toast(trErr(error.message),true);else depois(val?'NF marcada como recebida':'NF desmarcada');return}
    case 'pagofree': {const ps=D.pags.filter(p=>p.freelancer_id===t.dataset.f&&p.status==='a pagar');const {error}=await sb.from('pagamentos_freela').update({status:'pago',pago_em:hoje()}).in('id',ps.map(p=>p.id));if(error)toast(trErr(error.message),true);else depois(`Pago: ${money(ps.reduce((s,p)=>s+Number(p.valor),0))} a ${free(t.dataset.f).nome}`);return}
    case 'delrecado': {const {error}=await sb.from('recados').delete().eq('id',id);if(error)toast(trErr(error.message),true);else depois();return}
    case 'libera': {const sel=document.getElementById('lv-'+id);const patch={status:'ativo'};if(sel)patch.nivel=sel.value;if(await save('profiles',patch,id))depois('Acesso liberado');return}
    case 'bloq': if(await save('profiles',{status:'bloqueado'},id)) depois('Acesso bloqueado'); return;
    case 'candidatar': {const eu=meuFreela();const {error}=await sb.from('candidaturas').insert({trabalho_id:id,freelancer_id:eu.id,funcao:eu.papel==='operador'?'operador':'seller'});if(error)toast(trErr(error.message),true);else depois('Candidatura enviada. A Implay vai confirmar.');return}
    case 'retirar': if(await save('candidaturas',{status:'retirada'},id)) depois('Você desistiu desta vaga'); return;
    case 'recandidatar': if(await save('candidaturas',{status:'pendente'},id)) depois('Candidatura enviada de novo'); return;
    /* ---- comercial ---- */
    case 'gnova': UI.gen=novaGen();UI.view='gerador';fechar();draw();window.scrollTo(0,0);return;
    case 'geditar': {const p=D.props.find(x=>x.id===id);UI.gen=genDeProposta(p);UI.view='gerador';fechar();draw();window.scrollTo(0,0);return}
    case 'gduplicar': {const p=D.props.find(x=>x.id===id);const g=genDeProposta(p);UI.gen=novaGen({...g,id:null,numero:null,versao:1,origem_id:null,status:'rascunho',mes_ref:mesRefAtual()});UI.view='gerador';fechar();draw();window.scrollTo(0,0);toast('Cópia aberta no gerador. Troque a marca e os valores.');return}
    case 'gsalvar': genSalvar(t.dataset.st); return;
    case 'gimprimir': imprimir(UI.gen); return;
    case 'gpdf': imprimir(genDeProposta(D.props.find(x=>x.id===id))); return;
    case 'propst': {const s2=t.dataset.s;if(await save('propostas',{status:s2},id)){await depois(s2==='aceita'?'Proposta aceita! Gere o contrato.':'Situação atualizada')}return}
    case 'propcontrato': {const p=D.props.find(x=>x.id===id),G=genDeProposta(p);abrir('form','contrato',null,{c:{marca_id:p.marca_id,proposta_id:p.id,titulo:G.formato==='dia'?'Live de lançamento':'Lives recorrentes',escopo:pacoteTxt(G)+(G.afiliados?' · Marca + afiliados':''),pagamento:G.pagamento,vencimento_dia:G.venc_dia,fim:G.formato==='recorrente'?addD(hoje(),G.vigencia*30):''},k:{remun:p.remun,fixo:p.fixo,fixo_periodo:p.fixo_periodo,comissao:p.comissao,lives_mes:G.formato==='recorrente'?G.lives:'',horas_live:G.formato==='recorrente'?G.horas:''}});return}
    case 'precos': abrir('form','precos',null); return;
    case 'novocontrato': abrir('form','contrato',null); return;
    case 'editcontrato': abrir('form','contrato',id); return;
    case 'novacond': abrir('form','cond',id); return;
    case 'faturar': {const c=D.contratos.find(x=>x.id===id),m=mesContrato(c,t.dataset.p);const [y,mm]=t.dataset.p.split('-').map(Number);const venc=dkey(new Date(y,mm,Math.min(28,c.vencimento_dia||10)));
      const desc=`C-${pad(c.numero)} · ${MESES[mm-1]}: ${[m.fixo?'fixo mensal '+money(m.fixo):'',m.com?m.n+' trabalho(s) '+money(m.com):''].filter(Boolean).join(' + ')}`;
      if(await faturarTrabs(m.ts.filter(x=>x.status==='realizado'),c.marca_id,c.id,desc,m.total,venc))depois('Lançado em A receber: '+money(m.total));return}
  }
});
function snapForm(){const f=document.querySelector('#layer form');if(!f)return null;const o={};f.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{o[el.id]=el.type==='checkbox'?el.checked:el.value});f.querySelectorAll('[data-group]').forEach(g=>{const b=g.querySelector('[aria-pressed="true"]');o['g:'+g.dataset.group]=b?b.dataset.v:null});f.querySelectorAll('[data-mgroup]').forEach(g=>{o['m:'+g.dataset.mgroup]=[...g.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v)});return o}
function restoreForm(o){if(!o)return;const f=document.querySelector('#layer form');if(!f)return;Object.entries(o).forEach(([k,val])=>{if(k.startsWith('g:')){f.querySelectorAll(`[data-group="${k.slice(2)}"] button`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===val)))}else if(k.startsWith('m:')){f.querySelectorAll(`[data-mgroup="${k.slice(2)}"] button`).forEach(b=>b.setAttribute('aria-pressed',String(val.includes(b.dataset.v))))}else{const el=document.getElementById(k);if(el){if(el.type==='checkbox')el.checked=val;else el.value=val;if(el.matches('[data-ext]')){const x=document.getElementById(el.id+'-ext');if(x)x.textContent=el.value?dExt(el.value):''}}}});syncForm()}
async function voltarForm(sel,valor){
  const volta=UI.voltar;UI.voltar=null;await loadAll();redraw();
  if(volta){UI.layer={kind:volta.kind,type:volta.type,id:volta.id,extra:volta.extra};renderLayer();restoreForm(volta.snap);const el=document.getElementById(sel);if(el&&valor)el.value=valor}else fechar();
}
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.matches('[data-ext]')){const x=document.getElementById(el.id+'-ext');if(x)x.textContent=el.value?dExt(el.value):'';if(el.id==='tr-data'){const b=document.querySelector(`[data-group="jafoi"] [data-v="${el.value&&el.value<hoje()?'sim':'nao'}"]`);if(b)b.click()}return}
  if(el.id==='mc-cor'){document.querySelectorAll('[data-group="cor"] button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v.toLowerCase()===el.value.toLowerCase())));return}
  if(el.id==='estdia'){UI.estDia=el.value||null;draw();return}
  if(el.id==='tr-contrato'&&el.value){const c=D.contratos.find(x=>x.id===el.value);if(c){document.getElementById('tr-marca').value=c.marca_id;const r=remDoContrato(c.id,v('tr-data'));if(r){const f=document.getElementById('ftrab');f.querySelector(`[data-group="remun"] [data-v="${r.remun}"]`).click();document.getElementById('tr-fixo').value=valIn(r.fixo);document.getElementById('tr-pct').value=valIn(r.comissao);document.getElementById('tr-nota').textContent=r.nota||''}}return}
  if(el.dataset.escalar&&el.value){if(await escalar(el.dataset.escalar,el.value,el.dataset.f))depois('Escalado');return}
  if(el.dataset.nivel){if(await save('profiles',{nivel:el.value},el.dataset.nivel))depois('Nível alterado');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.layer)fechar()});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target, id=f.dataset.id||null;
  const btn=f.querySelector('button[type=submit]');
  const run=async fn=>{if(btn)btn.disabled=true;try{await fn()}finally{if(btn)btn.disabled=false}};
  if(['fsenha','fcriar','fesqueci','fnova'].includes(f.id)) return run(async()=>{
    const email=(document.getElementById('l-email')?.value||'').trim().toLowerCase(), senha=document.getElementById('l-senha')?.value||'';
    const fail=m=>{const er=document.getElementById('l-err');er.textContent=m;er.hidden=false};
    UI.email=email; const back=location.origin+location.pathname;
    if(f.id!=='fnova'&&!email.includes('@'))return fail('Digite um e-mail válido.');
    if((f.id==='fcriar'||f.id==='fnova')&&senha.length<6)return fail('A senha precisa ter pelo menos 6 caracteres.');
    if(f.id==='fsenha'){const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)return fail(/confirm/i.test(error.message)?'Falta confirmar o e-mail: toque no link que enviamos.':/invalid/i.test(error.message)?'E-mail ou senha não conferem.':error.message);return}
    if(f.id==='fcriar'){const {data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:back}});if(error)return fail(/registered|exists/i.test(error.message)?'Esse e-mail já tem conta. Use "Entrar com senha" ou "Esqueci a senha".':error.message);if(!data.session){UI.aviso=`Conta criada. Confirme pelo link que chegou em <b>${esc(email)}</b> e depois entre com e-mail e senha.`;draw()}return}
    if(f.id==='fesqueci'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(error)return fail(error.message);UI.aviso=`Se existir conta para <b>${esc(email)}</b>, chegou um link no e-mail para criar a senha nova.`;draw();return}
    if(f.id==='fnova'){const {error}=await sb.auth.updateUser({password:senha});if(error)return fail(error.message);UI.lmode='senha';toast('Senha alterada');start();return}
  });
  if(f.id==='frecado') return run(async()=>{const tx=v('r-txt');if(!tx)return;const {error}=await sb.from('recados').insert({texto:tx,de:ME.id});if(error)toast(trErr(error.message),true);else{document.getElementById('r-txt').value='';depois('Recado enviado')}});
  if(f.id==='fpessoa') return run(async()=>{
    const row={nome:v('ps-nome'),email:v('ps-email').toLowerCase(),nivel:gv(f,'psniv')||'manager'};
    if(!row.nome)return ferr('Digite o nome.');if(!row.email.includes('@'))return ferr('Digite um e-mail válido.');
    if(D.conv.some(c=>c.email===row.email)||D.profiles.some(p=>(p.email||'').toLowerCase()===row.email))return ferr('Esse e-mail já está cadastrado.');
    const {error}=await sb.from('convites').insert(row);if(error)return ferr(trErr(error.message));
    await voltarForm('tr-resp',row.nome);toast(row.nome+' cadastrado(a)');
  });
  /* ---- trabalho ---- */
  if(f.id==='ftrab') return run(async()=>{
    const data=v('tr-data');if(!data)return ferr('Escolha o dia.');
    const hi=v('tr-ini-h'),hf=v('tr-fim-h'),ini=hi?hi+':'+v('tr-ini-m'):null,fim=hf?hf+':'+v('tr-fim-m'):null;
    if((ini&&!fim)||(!ini&&fim))return ferr('Preencha início e fim, ou deixe os dois sem horário.');
    if(ini&&ini===fim)return ferr('O horário de início e de fim não podem ser iguais.');
    const local=gv(f,'local')||'paulista',sala=local==='paulista'?gv(f,'sala'):'';
    const tipo=gv(f,'tipo')||'live';
    const eqS=gmv_(f,'eqs'),eqO=gmv_(f,'eqo');
    let vs=Number(gv(f,'vs')||0),vo=Number(gv(f,'vo')||0);
    if(eqS.length>5||eqO.length>5)return ferr('No máximo 5 sellers e 5 operadores.');
    vs=Math.max(vs,eqS.length);vo=Math.max(vo,eqO.length);
    const fixo=parseValor(v('tr-fixo')),pct=parseValor(v('tr-pct'));if(isNaN(fixo)||isNaN(pct))return ferr('Valor de remuneração inválido.');
    const remun=gv(f,'remun')||'variavel';
    const ct=v('tr-contrato'),marca_id=v('tr-marca');
    if(ct){const c=D.contratos.find(x=>x.id===ct);if(c&&c.marca_id!==marca_id)return ferr('O contrato escolhido é de outra marca.')}
    const row={tipo,marca_id,contrato_id:ct||null,proposta_id:v('tr-prop')||null,titulo:v('tr-tit'),data,ini,fim,local,sala,local_txt:['cliente','outro'].includes(local)?v('tr-ltxt'):'',conta:tipo==='live'?(gv(f,'conta')||'marca'):'nenhuma',
      vagas_seller:vs,vagas_operador:vo,responsavel:v('tr-resp'),remun,fixo:['fixo','misto'].includes(remun)?fixo||0:0,comissao:['variavel','misto'].includes(remun)?pct||0:0,obs:v('tr-obs')};
    const conflito=local==='paulista'&&sala&&ini&&D.trab.find(x=>x.id!==id&&x.status!=='cancelado'&&x.local==='paulista'&&x.sala===sala&&x.data===data&&x.ini&&hm(x.ini)<fim&&ini<hm(x.fim));
    if(conflito&&!f.dataset.ok){f.dataset.ok='1';return ferr(`A sala ${sala} já tem o trabalho ${cod(conflito.codigo)} (${marca(conflito.marca_id).nome}) das ${hm(conflito.ini)} às ${hm(conflito.fim)}. Toque de novo em salvar para manter mesmo assim.`)}
    const jafoi=!id&&gv(f,'jafoi')==='sim';
    let res=null;
    if(jafoi){const g=parseValor(v('tr-gmv'));if(isNaN(g))return ferr('GMV inválido.');res={gmv:v('tr-gmv')?g:null,pedidos:v('tr-ped')?parseInt(v('tr-ped').replace(/\D/g,''),10):null,pico:v('tr-pico')?parseInt(v('tr-pico').replace(/\D/g,''),10):null}}
    const r=await save('trabalhos',row,id);if(!r)return;const tid=r.id||id;
    // equipe: tira quem saiu, inclui quem entrou
    const atual=eqDe(tid);
    for(const e2 of atual){if((e2.funcao==='seller'&&!eqS.includes(e2.freelancer_id))||(e2.funcao==='operador'&&!eqO.includes(e2.freelancer_id)))await sb.from('trabalho_equipe').delete().eq('id',e2.id)}
    const ins=[...eqS.filter(x=>!atual.some(e2=>e2.funcao==='seller'&&e2.freelancer_id===x)).map(x=>({trabalho_id:tid,freelancer_id:x,funcao:'seller'})),...eqO.filter(x=>!atual.some(e2=>e2.funcao==='operador'&&e2.freelancer_id===x)).map(x=>({trabalho_id:tid,freelancer_id:x,funcao:'operador'}))];
    if(ins.length){const {error}=await sb.from('trabalho_equipe').insert(ins);if(error)toast(trErr(error.message),true)}
    if(res){const {error}=await sb.from('trabalhos').update({...res,status:'realizado'}).eq('id',tid);if(error)toast(trErr(error.message),true)}
    if(jafoi){UI.layer={kind:'form',type:'trab',id:null,extra:{d:data}};await depois(`Trabalho ${cod(r.codigo)} lançado como realizado. Pode lançar o próximo.`);return}
    UI.layer={kind:'det',type:'trab',id:tid};await depois(id?'Trabalho salvo':`Trabalho ${cod(r.codigo)} criado`);
  });
  if(f.id==='fres') return run(async()=>{
    const g=parseValor(v('rs-gmv'));if(isNaN(g))return ferr('GMV inválido.');
    const t=trab(id);const hf=v('rs-fim-h');
    const row={gmv:v('rs-gmv')?g:null,pedidos:v('rs-ped')?parseInt(v('rs-ped').replace(/\D/g,''),10):null,pico:v('rs-pico')?parseInt(v('rs-pico').replace(/\D/g,''),10):null,fim:hf?hf+':'+v('rs-fim-m'):t.fim};
    if(!realizado(t))row.status='realizado';
    if(await save('trabalhos',row,id)){UI.layer={kind:'det',type:'trab',id};await depois(realizado(t)?'Resultado salvo':'Trabalho realizado')}
  });
  if(f.id==='fmarca') return run(async()=>{
    const row={nome:v('mc-nome'),segmento:v('mc-seg'),cor:gv(f,'cor')||v('mc-cor')||CORES[0],contato_nome:v('mc-cont'),contato_tel:v('mc-tel'),conta_propria:document.getElementById('mc-propria').checked};
    if(id)row.ativo=document.getElementById('mc-ativo').checked;
    if(!row.nome)return ferr('Digite o nome da marca.');
    const r=await save('marcas',row,id);if(!r)return;
    if(!UI.voltar&&UI.view==='gerador'&&UI.gen&&r.id&&!id)UI.gen.marca_id=r.id;
    const volta=UI.voltar;
    await voltarForm(volta&&volta.type==='trab'?'tr-marca':volta&&volta.type==='contrato'?'ct-marca':'',id?null:r.id);
    toast(id?'Marca salva':'Marca criada');
  });
  if(f.id==='ffree') return run(async()=>{
    const vh=parseValor(v('fr-vh')),vc=parseValor(v('fr-vc'));if(isNaN(vh)||isNaN(vc))return ferr('Valor inválido.');
    const row={nome:v('fr-nome'),papel:gv(f,'papel')||'seller',email:v('fr-email').toLowerCase(),telefone:v('fr-tel'),pix:v('fr-pix'),documento:v('fr-doc'),valor_hora:vh||0,valor_corte:vc||0,obs:v('fr-obs')};
    if(id)row.ativo=document.getElementById('fr-ativo').checked;
    if(!row.nome)return ferr('Digite o nome.');if(row.email&&!row.email.includes('@'))return ferr('E-mail inválido.');
    if(row.email&&D.free.some(x=>x.id!==id&&x.email===row.email))return ferr('Já existe outro freelancer com esse e-mail.');
    if(await save('freelancers',row,id)){fechar();await depois(id?'Cadastro salvo':row.email?'Cadastrado. Avise a pessoa para criar a conta com '+row.email:'Cadastrado')}
  });
  if(f.id==='frec') return run(async()=>{
    const valor=parseValor(v('rc-valor'));if(!(valor>0))return ferr('Digite o valor.');
    const row={marca_id:v('rc-marca'),descricao:v('rc-desc'),valor,vencimento:v('rc-venc'),nf_emitida:document.getElementById('rc-nf').checked};
    if(!row.vencimento)return ferr('Escolha o vencimento.');
    if(await save('recebimentos',row,id)){fechar();await depois(id?'Salvo':'Lançado')}
  });
  if(f.id==='fpag') return run(async()=>{
    const valor=parseValor(v('pg-valor'));if(isNaN(valor)||valor<0)return ferr('Valor inválido.');
    const row={descricao:v('pg-desc'),valor,competencia:v('pg-comp')||hoje(),nf_recebida:document.getElementById('pg-nf').checked};
    if(!id)row.freelancer_id=v('pg-free');
    if(await save('pagamentos_freela',row,id)){fechar();await depois(id?'Salvo':'Pagamento lançado')}
  });
  /* ---- comercial ---- */
  if(f.id==='fmotivo') return run(async()=>{if(await save('propostas',{motivo:v('pm-mot')},id))depois('Motivo salvo')});
  if(f.id==='fprecos') return run(async()=>{
    const c=cfgP(),pk=[];for(let i=0;document.getElementById('pk-n-'+i);i++){const nome=v('pk-n-'+i);if(!nome)continue;const n=x=>{const r=parseValor(v(x));return isNaN(r)?0:r};pk.push({nome,lives:parseInt(v('pk-l-'+i)||'0',10)||0,horas:n('pk-h-'+i),fixo:n('pk-f-'+i),pct:n('pk-p-'+i)})}
    if(!pk.length)return ferr('Deixe pelo menos um pacote.');
    const val={...c,pacotes:pk,afiliados:{fixo:parseValor(v('af-f'))||0,pct:parseValor(v('af-p'))||0},validade_dias:parseInt(v('cf-val'),10)||10,vigencia_meses:parseInt(v('cf-vig'),10)||3,instagram:v('cf-ig'),
      contatos:v('cf-ct').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,...b]=l.split('·');return {nome:a.trim(),tel:b.join('·').trim()}})};
    const {error}=await sb.from('config').upsert({chave:'propostas',valor:val,atualizado_em:new Date().toISOString()});
    if(error)return ferr(trErr(error.message));fechar();await depois('Tabela de preços salva');
  });
  if(f.id==='fcontrato') return run(async()=>{
    const row={marca_id:v('ct-marca'),proposta_id:v('ct-prop')||null,titulo:v('ct-tit'),inicio:v('ct-ini')||hoje(),fim:v('ct-fim')||null,status:gv(f,'cst')||'vigente',pagamento:gv(f,'cpag')||'',vencimento_dia:v('ct-venc')?parseInt(v('ct-venc'),10):null,escopo:v('ct-esc'),link_arquivo:v('ct-link'),obs:v('ct-obs')};
    if(row.fim&&row.fim<row.inicio)return ferr('O fim não pode ser antes do início.');
    let k=null;if(!id){k=lerCond(f);if(!k)return ferr('Valor inválido.')}
    const r=await save('contratos',row,id);if(!r)return;
    if(k){const {error}=await sb.from('contrato_condicoes').insert({...k,contrato_id:r.id,vale_desde:row.inicio,motivo:'Condição inicial'});if(error)toast(trErr(error.message),true)}
    UI.layer={kind:'det',type:'contrato',id:r.id||id};await depois(id?'Contrato salvo':'Contrato criado');
  });
  if(f.id==='fcond') return run(async()=>{
    const k=lerCond(f);if(!k)return ferr('Valor inválido.');const desde=v('cd-desde');if(!desde)return ferr('Escolha a data.');
    const {error}=await sb.from('contrato_condicoes').insert({...k,contrato_id:f.dataset.c,vale_desde:desde,motivo:v('cd-mot')});
    if(error)return ferr(trErr(error.message));UI.layer={kind:'det',type:'contrato',id:f.dataset.c};await depois('Nova condição registrada');
  });
});

/* =========================================================================
   INÍCIO
   ========================================================================= */
let channel=null, poll=null;
async function boot(){
  draw();
  if(!CFG_.SUPABASE_URL||!CFG_.SUPABASE_ANON_KEY){UI.status='semconfig';draw();return}
  if(!window.supabase){UI.status='offline';draw();return}
  sb=window.supabase.createClient(CFG_.SUPABASE_URL,CFG_.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession();SESSION=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const had=!!SESSION;SESSION=s;if(ev==='PASSWORD_RECOVERY'){UI.lmode='novasenha';UI.aviso='';UI.status='login';draw();return}if(!!s!==had&&UI.lmode!=='novasenha')start()});
  start();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UI.status==='ok')scheduleReload()});
}
async function start(){
  if(!SESSION||UI.lmode==='novasenha'){ME=null;UI.status='login';document.getElementById('app').innerHTML='';draw();return}
  UI.status='carregando';draw();
  try{
    const me=await sb.from('profiles').select('*').eq('id',SESSION.user.id).maybeSingle();
    ME=me.data;
    if(!ME){UI.status='semperfil';draw();return}
    if(ME.status!=='ativo'){UI.status=ME.status;draw();return}
    await loadAll();
    UI.status='ok';UI.view=isSeller()?'vagas':'painel';
    document.getElementById('app').innerHTML='';draw();
    if(!channel){channel=sb.channel('implay-central');['trabalhos','trabalho_equipe','candidaturas','propostas','contratos','contrato_condicoes','freelancers','pagamentos_freela','recebimentos','recados','marcas'].forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},scheduleReload));channel.subscribe()}
    clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==='visible')scheduleReload()},60000);
  }catch(e){UI.status='erro';UI.erro=e.message;draw()}
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
